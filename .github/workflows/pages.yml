name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/web-platform-prototype-testing-vkatpr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 주의: Pages 는 저장소 Settings > Pages 에서 Source 를 "GitHub Actions" 로
      # 한 번 설정해 주어야 합니다. GITHUB_TOKEN 으로는 자동 활성화가 불가능합니다.
      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
